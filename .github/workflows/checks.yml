name: Checks

# На каждый PR: юнит-тесты и автотест экранов (Playwright, iPhone, светлая и тёмная тема).
# Снимки экранов — артефакт «screens» у прогона.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node tests/run.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Screens
        run: node tests/e2e/screens.mjs
        env:
          E2E_OUT: ${{ runner.temp }}/screens
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 14
