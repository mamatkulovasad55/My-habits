# Cloudflare Worker — сервер My Habits (API для Telegram Mini App, бот, напоминания).
# Разворачивается workflow .github/workflows/worker.yml (id KV подставляется автоматически).
name = "my-habits-push"
main = "index.js"
compatibility_date = "2024-09-23"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

[vars]
DATA_OWNER = "__DATA_OWNER__"
DATA_REPO = "my-habits-data"
DATA_PATH = "data.json"
APP_URL = "__APP_URL__"

# Код раздела «Воздержание»: Durable Object со строго согласованным хранилищем (SQLite — доступно на бесплатном тарифе)
[[durable_objects.bindings]]
name = "LOCK"
class_name = "LockStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LockStore"]
